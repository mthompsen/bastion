# Bastion Linux processing pipeline (B3): log source routing for product: linux rules.
#
# Source: Sigma taxonomy appendix (SigmaHQ/sigma-specification,
# specification/sigma-appendix-taxonomy.md at ba9251aa834b11a70dbf80836b453dba99c5159e,
# read 2026-11-11), "Linux Folder" tables.
#
# A Linux event is one of three kinds, decided by its reader:
#   auditd  - an audit event merged from records (bastion.ingest.auditd)
#   sysmon  - Sysmon for Linux, Channel Linux-Sysmon/Operational
#   text    - any other line-oriented log (syslog, auth.log, journald)
# A listed service or category admits only the listed kinds (and EventIDs, where given). A
# service or category not listed is not restricted.

sysmon_channel: Linux-Sysmon/Operational

services:
  auditd: [auditd]
  auth: [text]
  clamav: [text]
  cron: [text]
  guacamole: [text]
  sshd: [text]
  sudo: [text]
  syslog: [text]
  vsftpd: [text]

categories:
  process_creation:
    - {kinds: [sysmon], event_ids: [1]}
    # Not in the taxonomy: Bastion has evaluated process_creation rules on merged auditd exec
    # events since B1 (Image from SYSCALL exe, CommandLine from the EXECVE argv).
    - {kinds: [auditd]}
  network_connection: [{kinds: [sysmon], event_ids: [3]}]
  file_event:
    - {kinds: [sysmon], event_ids: [11]}
    # auditd events carry TargetFilename when a PATH record created a file (see auditd below)
    - {kinds: [auditd]}

# auditd field mapping (B3 lever: auditd field mapping). Applied by bastion.ingest.auditd when
# it builds an event; a mapped name is added only when the event does not carry it already.
auditd:
  # SYSCALL: the enriched syscall name SigmaHQ auditd rules read (ENRICHED log_format writes
  # it; raw logs carry only the number). Looked up per arch from the kernel tables
  # (arch/x86/entry/syscalls/syscall_64.tbl, syscall_32.tbl). Only the syscalls SigmaHQ
  # r2026-07-01 rules name are listed; an unlisted number stays unmapped.
  syscall_names:
    "c000003e":  # x86_64
      "59": execve
      "99": sysinfo
      "103": syslog
      "133": mknod
      "135": personality
      "319": memfd_create
      "322": execveat
    "40000003":  # i386
      "11": execve
      "14": mknod
      "103": syslog
      "116": sysinfo
      "136": personality
      "356": memfd_create
      "358": execveat
  # CommandLine from the PROCTITLE record (the process's argv, NUL separated, which the kernel
  # truncates to 128 bytes) when the event has no EXECVE argv. Image is not derived from it.
  command_line_from_proctitle: true
  # TargetFilename from a PATH record with nametype=CREATE (joined to the CWD record when the
  # name is relative), so file_event rules can read file creations auditd records.
  target_filename_from_created_path: true
