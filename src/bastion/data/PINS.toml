# B5: standards data. The schemas (OCSF, ECS, Navigator layer format) are read by code and
# tests only; nothing is downloaded at run time for them. The mapping data (D3FEND, CTID,
# CAR) is fetched once by `bastion standards fetch` into data/standards/ and checked
# against the digests below. Each loader reports how its ATT&CK ids resolve against
# [attack] (version drift).

