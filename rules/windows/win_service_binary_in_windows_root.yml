# Bastion B4b (candidate from the T1059 dev capture; bench/b4b/candidates-dev.csv).
# Summiting the Pyramid: level 3. Remote service execution through the ADMIN$ share copies the
#   service binary to C:\Windows itself, whatever its name; tools that copy elsewhere evade it.
# Developed on dev capture attack_data/T1059/suspiciously_named_executables/windows (Sysmon 1:
#   Image, CommandLine, ParentImage). No test capture read.
# Tags: the behaviour is service execution after a copy over the admin share. The dataset's
#   label (T1059) is not what this rule detects, so it is not tagged.
title: Service Process Started From The Root Of The Windows Folder
id: 7ec09503-1e9d-4ae0-9cf1-8ea7cc4e20cd
status: experimental
description: >
    services.exe starts an executable that sits directly in C:\Windows rather than in a
    subfolder. Remote execution tools (PsExec, Impacket and Metasploit psexec) copy their
    service binary to ADMIN$, which is C:\Windows, and start it as a service.
references:
    - https://attack.mitre.org/techniques/T1569/002/
author: Bastion
date: 2026-11-13
tags:
    - attack.execution
    - attack.t1569.002
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith: '\services.exe'
        Image|re: '(?i)^C:\\Windows\\[^\\]+\.exe$'
    condition: selection
falsepositives:
    - Legitimate PsExec use (PSEXESVC.exe)
level: medium
