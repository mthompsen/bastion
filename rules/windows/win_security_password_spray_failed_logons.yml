# Bastion B4 (lever c, correlation content).
# Summiting the Pyramid: level 4, core to some implementations of T1110.003. Spraying needs one
#   failed authentication per account tried; a spray slower than 10 accounts per 5 minutes per
#   source, or spread across sources, evades the window.
# Developed on dev captures only: attack_data T1110.003 purplesharp_remote_spray_xml,
#   purplesharp_valid_users_ntlm_xml, purplesharp_multiple_users_from_process_xml (4625 with
#   one source and about 50 distinct TargetUserName within about a minute). No test capture
#   was read.
# Status experimental (hunting class): the goodware replay's Security log (win2022-evtx,
#   22,085 events) holds no 4625, 4768 or 4771, so it cannot show these rules are quiet on
#   benign data. On the 156 dev Windows captures only the four T1110.003 spray captures fire,
#   once each. Promotion to test is Mason's decision (B4.md section 4).
title: Failed Logons For Many Accounts From One Source
id: 3f6a9c21-7e48-4d0b-9b35-1c2e8a4f6d07
status: experimental
description: >
    Ten or more distinct accounts fail to log on (Security 4625) from the same source address on
    the same host within five minutes: one source trying many accounts, the shape of password
    spraying. A local process spraying accounts reports the source as "-", which groups too.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: Bastion
date: 2026-11-11
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - failed_logon
    group-by:
        - Computer
        - IpAddress
    timespan: 5m
    condition:
        field: TargetUserName
        gte: 10
falsepositives:
    - A misconfigured service or script retrying a list of stale accounts from one host
    - Vulnerability scanners authenticating with a list of accounts
level: medium
---
# Building block: alone it would fire on every failed logon, so it exists only as the
# correlation's input and cannot alert on its own.
name: failed_logon
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection
